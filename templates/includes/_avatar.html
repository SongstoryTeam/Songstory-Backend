{% load core_extras %}<span class="user-avatar{% if size %} user-avatar--{{ size }}{% endif %}" data-accent="{{ person.profile.accent }}"{% if person.profile.has_avatar %} style="{% avatar_style person.profile %}"{% endif %} aria-hidden="true">{% if person.profile.has_avatar %}<img class="user-avatar__image" src="{{ person.profile.avatar_url }}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" data-cover>{% endif %}<span class="user-avatar__letter">{{ person.username|first|upper }}</span></span>
