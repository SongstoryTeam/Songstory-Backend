<a href="{{ href }}" class="settings-row settings-row--action">
    <span class="settings-row__icon"><i data-lucide="{{ icon }}" size="18" aria-hidden="true"></i></span>
    <span class="settings-row__text">
        <span class="settings-row__title">{{ title }}</span>
        <span class="settings-row__desc">{{ desc }}</span>
    </span>
    <i data-lucide="chevron-right" size="16" class="settings-row__chevron" aria-hidden="true"></i>
</a>
