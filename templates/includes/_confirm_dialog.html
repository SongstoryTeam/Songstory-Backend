<dialog class="confirm-dialog" data-confirm-dialog aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
    <form method="dialog" class="confirm-dialog__panel">
        <h2 class="confirm-dialog__title" id="confirm-dialog-title" data-confirm-title></h2>
        <p class="confirm-dialog__message" id="confirm-dialog-message" data-confirm-message></p>
        <div class="confirm-dialog__actions">
            <button type="submit" value="cancel" class="btn btn-ghost" autofocus>Скасувати</button>
            <button type="submit" value="confirm" class="btn btn-danger-solid" data-confirm-action></button>
        </div>
    </form>
</dialog>
