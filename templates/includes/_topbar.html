<header class="topbar">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Меню" aria-controls="sidebar" aria-expanded="false">
        <i data-lucide="menu" size="20"></i>
    </button>

    <form class="topbar__search site-search" action="{% url 'core:search' %}" method="get"
          role="search" autocomplete="off" data-site-search>
        <i data-lucide="search" size="16"></i>
        <input type="text" name="q" id="site-search-input" placeholder="Пошук книг або авторів…"
               value="{{ search_query|default:'' }}" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-haspopup="listbox"
               aria-controls="site-search-listbox" aria-autocomplete="list">
        <button type="button" class="site-search__clear" data-site-search-clear
                aria-label="Очистити пошук" hidden>
            <i data-lucide="x" size="14"></i>
        </button>

        <div class="site-search__panel" id="site-search-panel" data-site-search-panel hidden>
            <ul class="site-search__listbox" id="site-search-listbox" role="listbox"
                aria-label="Результати пошуку"></ul>
        </div>
    </form>

    <div class="topbar__actions">
        {% if user.is_authenticated %}
            <div class="notify" data-notify>
                <a href="{% url 'core:notifications' %}" class="topbar__notify" aria-label="Сповіщення"
                   aria-haspopup="true" aria-expanded="false" data-notify-toggle>
                    <i data-lucide="bell" size="18"></i>
                    <span class="topbar__notify-dot" data-notify-dot {% if not unread_notifications %}hidden{% endif %}></span>
                </a>

                <div class="notify__panel" id="notify-panel" role="menu" data-notify-panel hidden>
                    <div class="notify__panel-header">
                        <span class="notify__panel-title">Сповіщення</span>
                        <button type="button" class="notify__mark-all" data-notify-mark-all hidden>
                            Позначити всі прочитаними
                        </button>
                    </div>
                    <ul class="notify__list" data-notify-list></ul>
                    <a href="{% url 'core:notifications' %}" class="notify__footer">Переглянути всі</a>
                </div>
            </div>
            <a href="{% url 'core:create_book' %}" class="btn btn-accent btn-sm">
                <i data-lucide="plus" size="16"></i> Додати книгу
            </a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">Увійти</a>
            <a href="{% url 'signup' %}" class="btn btn-accent btn-sm">Реєстрація</a>
        {% endif %}
    </div>
</header>
